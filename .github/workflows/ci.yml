name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.x
      - run: dotnet restore
      - run: dotnet test
      - run: dotnet format --verify-no-changes
      - name: Publish test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/HoodKeys.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: Upload test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: hoodkeys-test-build
          path: |
            publish/hoodkeys.exe
            samples/mywhoosh.json
          retention-days: 14
          if-no-files-found: error
